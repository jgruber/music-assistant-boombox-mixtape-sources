name: Upstream MA version bump

on:
  schedule:
    - cron: '17 7 * * *'  # daily at 07:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve latest upstream MA stable release
        id: upstream
        run: |
          set -euo pipefail
          latest=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/music-assistant/server/releases/latest" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])')
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Upstream latest: $latest"

      - name: Read current fork base version
        id: current
        run: |
          set -euo pipefail
          current=$(grep -E '^\s*amd64:' music_assistant_anon/build.yaml \
            | head -1 | awk -F':' '{print $NF}' | tr -d ' ')
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "Current base: $current"

      - name: Decide whether to bump
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ steps.upstream.outputs.latest }}" = "${{ steps.current.outputs.current }}" ]; then
            echo "Already on upstream latest; nothing to do."
            echo "bump=false" >> "$GITHUB_OUTPUT"
          else
            echo "bump=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify patch_core.py anchor still exists in new upstream
        if: steps.decide.outputs.bump == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.upstream.outputs.latest }}"
          image="ghcr.io/music-assistant/server:${tag}"
          docker pull "$image"
          anchor_line=$(docker run --rm --entrypoint sh "$image" -c '
            find /app/venv -name controller.py -path "*/controllers/music/*" -print -quit
          ')
          if [ -z "$anchor_line" ]; then
            echo "::error::Could not locate controller.py in $image" ; exit 1
          fi
          docker run --rm --entrypoint cat "$image" "$anchor_line" > /tmp/controller.py
          if ! grep -q 'if (url_result := await self._search_shareable_url(search_query)) is not None:' /tmp/controller.py; then
            echo "::error::patch_core.py anchor missing in $image. Patch needs manual review."
            exit 2
          fi
          echo "patch_core anchor OK for $tag"

      - name: Apply bumps
        if: steps.decide.outputs.bump == 'true'
        run: |
          set -euo pipefail
          new="${{ steps.upstream.outputs.latest }}"
          # build.yaml: both arches
          sed -i -E "s|(ghcr.io/music-assistant/server:)[^[:space:]]+|\1${new}|g" music_assistant_anon/build.yaml
          # config.yaml version: <upstream>-boombox.1
          sed -i -E "s|^(version:\s*).*|\1${new}-boombox.1|" music_assistant_anon/config.yaml
          # Dockerfile LABEL version
          sed -i -E 's|(io\.hass\.version=")[^"]+(")|\1'"${new}"'-boombox.1\2|' music_assistant_anon/Dockerfile

      - name: Open pull request
        if: steps.decide.outputs.bump == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: upstream-bump/${{ steps.upstream.outputs.latest }}
          commit-message: "bump upstream MA to ${{ steps.upstream.outputs.latest }}"
          title: "Bump upstream MA to ${{ steps.upstream.outputs.latest }}"
          body: |
            Automated bump from ${{ steps.current.outputs.current }} → ${{ steps.upstream.outputs.latest }}.

            `patch_core.py` anchor verified against the new upstream image.

            Review, merge, then in HA: open the add-on → **Rebuild**.
          delete-branch: true
