name: Music Assistant Server (jgruber fork)
version: 2.10.8-fork.6
slug: music_assistant_anon
description: >
  Music Assistant server with a HACS-style custom-providers loader (soft
  fork of music-assistant/server) and the Custom Provider Installer plugin
  pre-staged. Install any custom provider from a GitHub URL through the
  plugin's config UI once Music Assistant is up — the add-on itself takes
  no position on which providers to install.
url: https://music-assistant.io
arch:
  - amd64
  - aarch64
homeassistant_api: true
hassio_api: true
hassio_role: manager
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-assistant
panel_title: Music Assistant Server
panel_admin: false
uart: false
apparmor: false
map:
  - media:rw
  - ssl:ro
init: false
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
  - library.db.backup
stage: stable
tmpfs: true
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
