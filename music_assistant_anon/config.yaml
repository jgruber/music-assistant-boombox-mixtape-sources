name: Music Assistant (Boombox + Mixtape + JW.org Music)
version: 2.10.8-fork.1
slug: music_assistant_anon
description: >
  Music Assistant with three extra providers baked in: Boombox (public YouTube
  Music), Mixtape (Spotify catalog with YouTube audio), and JW.org Music
  (public music catalog from jw.org). Built on ghcr.io/jgruber/music-assistant-server
  (soft fork of music-assistant/server); mirrors every setting of the upstream
  music_assistant add-on except the slug/name.
url: https://music-assistant.io
arch:
  - amd64
  - aarch64
homeassistant_api: true
hassio_api: true
hassio_role: manager
discovery:
  - music_assistant
auth_api: true
host_network: true
ingress: true
ingress_port: 8094
audio: true
panel_icon: mdi:music-assistant
panel_title: Music Assistant (fork)
panel_admin: false
uart: false
apparmor: false
map:
  - media:rw
  - ssl:ro
init: false
backup_exclude:
  - cache.db
  - collage_images/*
  - .cache/*
  - library.db.backup
stage: stable
tmpfs: true
options:
  log_level: info
  safe_mode: false
schema:
  log_level: list(debug|info|warning|error)
  safe_mode: bool
privileged:
  - SYS_ADMIN
  - DAC_READ_SEARCH
