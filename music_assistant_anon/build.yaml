# Base image is now the jgruber fork of Music Assistant server, which bakes in the three
# providers and all the related code changes. :latest tracks the fork's main branch head;
# bump to an explicit :vX.Y.Z or :main-<sha> for reproducible rollouts.
build_from:
  amd64: ghcr.io/jgruber/music-assistant-server:latest
  aarch64: ghcr.io/jgruber/music-assistant-server:latest
